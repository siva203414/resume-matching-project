apiVersion: apps/v1
kind: Deployment

metadata:
  name: resume-screening-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: resume-screening

  template:
    metadata:
      labels:
        app: resume-screening

    spec:
      containers:
        - name: resume-screening-container
          image: YOUR_DOCKERHUB_USERNAME/resume-screening:v1
          ports:
            - containerPort: 8501
